<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Antioquia</title>

    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        /* =========================================
           ENCABEZADO
        ========================================= */

        header {
            background: #172033;
            color: white;
            text-align: center;
            padding: 24px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .subtitulo {
            font-size: 18px;
            opacity: 0.9;
        }


        /* =========================================
           CONTENEDOR
        ========================================= */

        main {
            width: 94%;
            max-width: 1250px;
            margin: 25px auto;
        }

        .panel {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }


        /* =========================================
           ESTADÍSTICAS
        ========================================= */

        .estadisticas {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 18px;
        }

        .estadistica {

            background: #f8fafc;

            border-radius: 12px;

            padding: 15px;

            text-align: center;
        }

        .numero {

            font-size: 30px;

            font-weight: bold;
        }

        .texto {

            margin-top: 4px;

            color: #64748b;

            font-size: 14px;
        }


        /* =========================================
           BARRA DE PROGRESO
        ========================================= */

        .progreso {

            width: 100%;

            height: 18px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 22px;
        }

        .barra {

            width: 0%;

            height: 100%;

            background: #22c55e;

            transition:
                width 0.35s ease,
                background 0.25s ease;
        }


        /* =========================================
           CONTROLES
        ========================================= */

        .controles {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;

            flex-wrap: wrap;
        }

        .buscador {

            flex: 1;

            min-width: 220px;

            padding: 12px 15px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .buscador:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 0 2px
                rgba(34,197,94,0.15);
        }

        .boton {

            border: none;

            border-radius: 10px;

            padding: 11px 16px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .boton:hover {

            transform: translateY(-1px);

            opacity: 0.9;
        }

        .boton-verde {

            background: #22c55e;

            color: white;
        }

        .boton-gris {

            background: #64748b;

            color: white;
        }

        .boton-rojo {

            background: #ef4444;

            color: white;
        }


        /* =========================================
           SELECTOR DE COLOR
        ========================================= */

        .selector-color {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 18px;

            padding: 12px;

            background: #f8fafc;

            border-radius: 10px;
        }

        .selector-color span {

            font-size: 14px;

            font-weight: bold;
        }

        .color-opcion {

            width: 28px;

            height: 28px;

            border-radius: 50%;

            border: 3px solid transparent;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 1px 4px
                rgba(0,0,0,0.2);
        }

        .color-opcion:hover {

            transform: scale(1.12);
        }

        .color-opcion.seleccionado {

            border-color: #111827;

            transform: scale(1.15);
        }


        /* =========================================
           MAPA
        ========================================= */

        #mapa {

            width: 100%;

            height: 650px;

            border-radius: 14px;

            overflow: hidden;

            border: 1px solid #d1d5db;
        }


        /* =========================================
           LEYENDA
        ========================================= */

        .leyenda {

            display: flex;

            justify-content: center;

            gap: 25px;

            margin-top: 15px;

            flex-wrap: wrap;
        }

        .leyenda-item {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;
        }

        .color {

            width: 19px;

            height: 19px;

            border-radius: 4px;

            border: 1px solid #777;
        }

        .color-no {

            background: #d1d5db;
        }

        #colorLeyenda {

            background: #22c55e;
        }


        /* =========================================
           LISTA
        ========================================= */

        .lista-contenedor {

            margin-top: 25px;

            border-top: 1px solid #e5e7eb;

            padding-top: 20px;
        }

        .lista-contenedor h2 {

            margin-top: 0;
        }

        #listaMunicipios {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );

            gap: 8px;
        }

        .municipio-lista {

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            border-radius: 8px;

            padding: 9px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }

        .municipio-lista:hover {

            background: #dcfce7;

            transform: translateY(-1px);
        }


        /* =========================================
           PANEL DEL MUNICIPIO
        ========================================= */

        .panel-municipio {

            position: fixed;

            top: 0;

            right: -450px;

            width: 430px;

            max-width: 95vw;

            height: 100vh;

            background: white;

            z-index: 2000;

            box-shadow:
                -5px 0 25px
                rgba(0,0,0,0.18);

            padding: 25px;

            overflow-y: auto;

            transition:
                right 0.3s ease;
        }

        .panel-municipio.abierto {

            right: 0;
        }

        .panel-superior {

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #e5e7eb;

            padding-bottom: 15px;

            margin-bottom: 20px;
        }

        .panel-superior h2 {

            margin: 0;

            font-size: 25px;
        }

        .cerrar {

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 50%;

            background: #e5e7eb;

            font-size: 20px;

            cursor: pointer;
        }

        .estado-ficha {

            padding: 10px;

            border-radius: 8px;

            background: #f8fafc;

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;
        }

        .campo {

            margin-bottom: 18px;
        }

        .campo label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;
        }

        .campo input,
        .campo textarea {

            width: 100%;

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-family: Arial, sans-serif;

            font-size: 15px;

            outline: none;
        }

        .campo textarea {

            min-height: 110px;

            resize: vertical;
        }

        .campo input:focus,
        .campo textarea:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 0 2px
                rgba(34,197,94,0.12);
        }

        .acciones-ficha {

            display: flex;

            flex-direction: column;

            gap: 9px;

            margin-top: 20px;
        }

        .boton-ficha {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;
        }

        .guardar {

            background: #22c55e;

            color: white;
        }

        .marcar {

            background: #172033;

            color: white;
        }

        .desmarcar {

            background: #ef4444;

            color: white;
        }

        .eliminar-datos {

            background: #e5e7eb;

            color: #374151;
        }

        .mensaje-guardado {

            text-align: center;

            color: #16a34a;

            font-size: 14px;

            font-weight: bold;

            min-height: 20px;

            margin-top: 10px;
        }


        /* =========================================
           FONDO DEL PANEL
        ========================================= */

        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.35);

            z-index: 1500;

            display: none;
        }

        .overlay.visible {

            display: block;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {

            header {

                padding: 20px 10px;
            }

            header h1 {

                font-size: 27px;
            }

            .subtitulo {

                font-size: 16px;
            }

            main {

                width: 96%;

                margin: 12px auto;
            }

            .panel {

                padding: 14px;

                border-radius: 14px;
            }

            .estadisticas {

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 7px;
            }

            .estadistica {

                padding: 10px 5px;
            }

            .numero {

                font-size: 23px;
            }

            .texto {

                font-size: 12px;
            }

            #mapa {

                height: 550px;
            }

            .controles {

                flex-direction: column;
            }

            .buscador {

                width: 100%;
            }

            .boton {

                width: 100%;
            }

            .panel-municipio {

                width: 100%;

                max-width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     ENCABEZADO
========================================= -->

<header>

    <h1>MI ANTIOQUIA</h1>

    <div class="subtitulo">

        <span id="contador">
            0
        </span>

        / 125 municipios visitados

    </div>

</header>


<main>

    <div class="panel">


        <!-- =====================================
             ESTADÍSTICAS
        ====================================== -->

        <div class="estadisticas">

            <div class="estadistica">

                <div
                    class="numero"
                    id="numeroVisitados"
                >
                    0
                </div>

                <div class="texto">
                    Visitados
                </div>

            </div>


            <div class="estadistica">

                <div
                    class="numero"
                    id="numeroPendientes"
                >
                    125
                </div>

                <div class="texto">
                    Pendientes
                </div>

            </div>


            <div class="estadistica">

                <div
                    class="numero"
                    id="porcentaje"
                >
                    0%
                </div>

                <div class="texto">
                    Antioquia recorrido
                </div>

            </div>

        </div>


        <!-- =====================================
             BARRA
        ====================================== -->

        <div class="progreso">

            <div
                class="barra"
                id="barra"
            ></div>

        </div>


        <!-- =====================================
             COLOR
        ====================================== -->

        <div class="selector-color">

            <span>
                Color de municipios visitados:
            </span>


            <button
                class="color-opcion"
                style="background:#22c55e"
                data-color="#22c55e"
                title="Verde"
                onclick="seleccionarColor('#22c55e')"
            ></button>


            <button
                class="color-opcion"
                style="background:#3b82f6"
                data-color="#3b82f6"
                title="Azul"
                onclick="seleccionarColor('#3b82f6')"
            ></button>


            <button
                class="color-opcion"
                style="background:#8b5cf6"
                data-color="#8b5cf6"
                title="Morado"
                onclick="seleccionarColor('#8b5cf6')"
            ></button>


            <button
                class="color-opcion"
                style="background:#f97316"
                data-color="#f97316"
                title="Naranja"
                onclick="seleccionarColor('#f97316')"
            ></button>


            <button
                class="color-opcion"
                style="background:#ef4444"
                data-color="#ef4444"
                title="Rojo"
                onclick="seleccionarColor('#ef4444')"
            ></button>


            <button
                class="color-opcion"
                style="background:#14b8a6"
                data-color="#14b8a6"
                title="Turquesa"
                onclick="seleccionarColor('#14b8a6')"
            ></button>


            <button
                class="color-opcion"
                style="background:#eab308"
                data-color="#eab308"
                title="Amarillo"
                onclick="seleccionarColor('#eab308')"
            ></button>

        </div>


        <!-- =====================================
             CONTROLES
        ====================================== -->

        <div class="controles">

            <input
                type="text"
                id="buscador"
                class="buscador"
                placeholder="Buscar municipio..."
            >


            <button
                class="boton boton-verde"
                onclick="mostrarVisitados()"
            >
                Mis municipios
            </button>


            <button
                class="boton boton-gris"
                onclick="mostrarTodos()"
            >
                Mostrar todos
            </button>


            <button
                class="boton boton-rojo"
                onclick="reiniciarProgreso()"
            >
                Reiniciar
            </button>

        </div>


        <!-- =====================================
             MAPA
        ====================================== -->

        <div id="mapa"></div>


        <!-- =====================================
             LEYENDA
        ====================================== -->

        <div class="leyenda">

            <div class="leyenda-item">

                <div class="color color-no"></div>

                No visitado

            </div>


            <div class="leyenda-item">

                <div
                    class="color"
                    id="colorLeyenda"
                ></div>

                Visitado

            </div>

        </div>


        <!-- =====================================
             LISTA
        ====================================== -->

        <div class="lista-contenedor">

            <h2 id="tituloLista">
                Mis municipios visitados
            </h2>

            <div id="listaMunicipios"></div>

        </div>


    </div>

</main>


<!-- =========================================
     FONDO DEL PANEL
========================================= -->

<div
    id="overlay"
    class="overlay"
    onclick="cerrarFicha()"
></div>


<!-- =========================================
     FICHA DEL MUNICIPIO
========================================= -->

<div
    id="panelMunicipio"
    class="panel-municipio"
>

    <div class="panel-superior">

        <h2 id="nombreFicha">
            Municipio
        </h2>

        <button
            class="cerrar"
            onclick="cerrarFicha()"
        >
            ×
        </button>

    </div>


    <div
        id="estadoFicha"
        class="estado-ficha"
    >
        No visitado
    </div>


    <!-- FECHA -->

    <div class="campo">

        <label for="fechaVisita">
            Fecha de visita
        </label>

        <input
            type="date"
            id="fechaVisita"
        >

    </div>


    <!-- LUGARES -->

    <div class="campo">

        <label for="lugaresVisitados">
            Lugares que viste o visitaste
        </label>

        <textarea
            id="lugaresVisitados"
            placeholder="Ejemplo: parque principal, iglesia, río, mirador..."
        ></textarea>

    </div>


    <!-- NOTAS -->

    <div class="campo">

        <label for="notasMunicipio">
            Mis notas
        </label>

        <textarea
            id="notasMunicipio"
            placeholder="Escribe aquí lo que quieras recordar de este municipio..."
        ></textarea>

    </div>


    <!-- ACCIONES -->

    <div class="acciones-ficha">

        <button
            class="boton-ficha guardar"
            onclick="guardarFicha()"
        >
            Guardar información
        </button>


        <button
            id="botonMarcar"
            class="boton-ficha marcar"
            onclick="marcarDesdeFicha()"
        >
            Marcar como visitado
        </button>


        <button
            id="botonDesmarcar"
            class="boton-ficha desmarcar"
            onclick="desmarcarDesdeFicha()"
            style="display:none"
        >
            Marcar como no visitado
        </button>


        <button
            class="boton-ficha eliminar-datos"
            onclick="eliminarDatosFicha()"
        >
            Borrar información de este municipio
        </button>

    </div>


    <div
        id="mensajeGuardado"
        class="mensaje-guardado"
    ></div>

</div>


<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const TOTAL_MUNICIPIOS = 125;


const GEOJSON_URL =
"https://raw.githubusercontent.com/ytolosa/mapas-colombia/main/output/geojson/col_municipios_real_nacional.geojson";


// =====================================================
// DATOS
// =====================================================

// Lista de municipios visitados

let visitados = JSON.parse(

    localStorage.getItem(
        "municipiosVisitadosAntioquia"
    )

) || [];


// Información personal

let informacionMunicipios = JSON.parse(

    localStorage.getItem(
        "informacionMunicipiosAntioquia"
    )

) || {};


// Color elegido

let colorVisitado =

    localStorage.getItem(
        "colorVisitadoAntioquia"
    )

    || "#22c55e";


// Municipio actualmente abierto

let municipioActual = null;


// =====================================================
// MAPA
// =====================================================

const mapa = L.map("mapa");

mapa.setView(
    [6.5, -75.5],
    7
);


// =====================================================
// REFERENCIAS
// =====================================================

const capasMunicipios = {};

const datosMunicipios = {};

let capaAntioquia = null;


// =====================================================
// ESTILO MUNICIPIO
// =====================================================

function estiloMunicipio(feature) {

    const codigo =
        String(
            feature.properties.divipola_mun
        );


    const visitado =
        visitados.includes(codigo);


    return {

        fillColor:
            visitado
                ? colorVisitado
                : "#d1d5db",

        weight: 1,

        color: "#555",

        fillOpacity: 0.85

    };

}


// =====================================================
// ESTADÍSTICAS
// =====================================================

function actualizarEstadisticas() {

    const cantidad =
        visitados.length;


    const porcentaje =
        (
            cantidad /
            TOTAL_MUNICIPIOS *
            100
        ).toFixed(1);


    document.getElementById(
        "contador"
    ).textContent =
        cantidad;


    document.getElementById(
        "numeroVisitados"
    ).textContent =
        cantidad;


    document.getElementById(
        "numeroPendientes"
    ).textContent =
        TOTAL_MUNICIPIOS - cantidad;


    document.getElementById(
        "porcentaje"
    ).textContent =
        porcentaje + "%";


    document.getElementById(
        "barra"
    ).style.width =
        porcentaje + "%";


    document.getElementById(
        "barra"
    ).style.background =
        colorVisitado;


    document.getElementById(
        "colorLeyenda"
    ).style.background =
        colorVisitado;


    actualizarLista();

}


// =====================================================
// GUARDAR VISITAS
// =====================================================

function guardarVisitas() {

    localStorage.setItem(

        "municipiosVisitadosAntioquia",

        JSON.stringify(visitados)

    );

}


// =====================================================
// GUARDAR INFORMACIÓN
// =====================================================

function guardarInformacion() {

    localStorage.setItem(

        "informacionMunicipiosAntioquia",

        JSON.stringify(
            informacionMunicipios
        )

    );

}


// =====================================================
// COLOR
// =====================================================

function seleccionarColor(color) {

    colorVisitado = color;


    localStorage.setItem(
        "colorVisitadoAntioquia",
        color
    );


    actualizarSeleccionColor();


    Object.values(
        capasMunicipios
    ).forEach(
        capa => {

            capa.setStyle(
                estiloMunicipio(
                    capa.feature
                )
            );

        }
    );


    actualizarEstadisticas();

}


// =====================================================
// ACTUALIZAR COLOR SELECCIONADO
// =====================================================

function actualizarSeleccionColor() {

    document
        .querySelectorAll(
            ".color-opcion"
        )
        .forEach(
            boton => {

                boton.classList.toggle(

                    "seleccionado",

                    boton.dataset.color
                    === colorVisitado

                );

            }
        );

}


// =====================================================
// CAMBIAR ESTADO
// =====================================================

function cambiarEstado(
    codigo,
    nombre,
    capa
) {

    const indice =
        visitados.indexOf(codigo);


    if (indice === -1) {

        visitados.push(codigo);

    } else {

        visitados.splice(
            indice,
            1
        );

    }


    guardarVisitas();


    capa.setStyle(
        estiloMunicipio(
            capa.feature
        )
    );


    actualizarEstadisticas();


    abrirFicha(
        codigo,
        nombre
    );

}


// =====================================================
// MARCAR DESDE FICHA
// =====================================================

function marcarDesdeFicha() {

    if (!municipioActual) {
        return;
    }


    const codigo =
        municipioActual.codigo;


    if (
        !visitados.includes(codigo)
    ) {

        visitados.push(codigo);

        guardarVisitas();

    }


    actualizarEstadoFicha();


    capasMunicipios[
        codigo
    ].setStyle(

        estiloMunicipio(
            capasMunicipios[
                codigo
            ].feature
        )

    );


    actualizarEstadisticas();

}


// =====================================================
// DESMARCAR
// =====================================================

function desmarcarDesdeFicha() {

    if (!municipioActual) {
        return;
    }


    const codigo =
        municipioActual.codigo;


    const indice =
        visitados.indexOf(codigo);


    if (indice !== -1) {

        visitados.splice(
            indice,
            1
        );

        guardarVisitas();

    }


    actualizarEstadoFicha();


    capasMunicipios[
        codigo
    ].setStyle(

        estiloMunicipio(
            capasMunicipios[
                codigo
            ].feature
        )

    );


    actualizarEstadisticas();

}


// =====================================================
// ABRIR FICHA
// =====================================================

function abrirFicha(
    codigo,
    nombre
) {

    municipioActual = {

        codigo:
            String(codigo),

        nombre:
            nombre

    };


    document.getElementById(
        "nombreFicha"
    ).textContent =
        nombre;


    const informacion =
        informacionMunicipios[
            codigo
        ] || {};


    document.getElementById(
        "fechaVisita"
    ).value =
        informacion.fecha || "";


    document.getElementById(
        "lugaresVisitados"
    ).value =
        informacion.lugares || "";


    document.getElementById(
        "notasMunicipio"
    ).value =
        informacion.notas || "";


    document.getElementById(
        "mensajeGuardado"
    ).textContent =
        "";


    actualizarEstadoFicha();


    document.getElementById(
        "panelMunicipio"
    ).classList.add(
        "abierto"
    );


    document.getElementById(
        "overlay"
    ).classList.add(
        "visible"
    );

}


// =====================================================
// ACTUALIZAR ESTADO DE FICHA
// =====================================================

function actualizarEstadoFicha() {

    if (!municipioActual) {
        return;
    }


    const visitado =
        visitados.includes(
            municipioActual.codigo
        );


    const estado =
        document.getElementById(
            "estadoFicha"
        );


    const botonMarcar =
        document.getElementById(
            "botonMarcar"
        );


    const botonDesmarcar =
        document.getElementById(
            "botonDesmarcar"
        );


    if (visitado) {

        estado.textContent =
            "✓ Municipio visitado";


        estado.style.background =
            "#dcfce7";


        estado.style.color =
            "#166534";


        botonMarcar.style.display =
            "none";


        botonDesmarcar.style.display =
            "block";

    } else {

        estado.textContent =
            "No visitado";


        estado.style.background =
            "#f1f5f9";


        estado.style.color =
            "#475569";


        botonMarcar.style.display =
            "block";


        botonDesmarcar.style.display =
            "none";

    }

}


// =====================================================
// GUARDAR FICHA
// =====================================================

function guardarFicha() {

    if (!municipioActual) {
        return;
    }


    const codigo =
        municipioActual.codigo;


    informacionMunicipios[
        codigo
    ] = {

        nombre:
            municipioActual.nombre,

        fecha:
            document.getElementById(
                "fechaVisita"
            ).value,

        lugares:
            document.getElementById(
                "lugaresVisitados"
            ).value,

        notas:
            document.getElementById(
                "notasMunicipio"
            ).value

    };


    guardarInformacion();


    // Si se guardan datos de visita,
    // automáticamente se marca como visitado.

    if (
        !visitados.includes(codigo)
    ) {

        visitados.push(codigo);

        guardarVisitas();


        capasMunicipios[
            codigo
        ].setStyle(

            estiloMunicipio(
                capasMunicipios[
                    codigo
                ].feature
            )

        );

    }


    actualizarEstadoFicha();


    actualizarEstadisticas();


    document.getElementById(
        "mensajeGuardado"
    ).textContent =
        "✓ Información guardada";


    setTimeout(
        () => {

            document.getElementById(
                "mensajeGuardado"
            ).textContent = "";

        },
        2500
    );

}


// =====================================================
// BORRAR INFORMACIÓN
// =====================================================

function eliminarDatosFicha() {

    if (!municipioActual) {
        return;
    }


    const confirmar =
        confirm(
            "¿Quieres borrar las notas y datos de este municipio?"
        );


    if (!confirmar) {
        return;
    }


    delete informacionMunicipios[
        municipioActual.codigo
    ];


    guardarInformacion();


    document.getElementById(
        "fechaVisita"
    ).value = "";


    document.getElementById(
        "lugaresVisitados"
    ).value = "";


    document.getElementById(
        "notasMunicipio"
    ).value = "";


    document.getElementById(
        "mensajeGuardado"
    ).textContent =
        "Información eliminada";


    setTimeout(
        () => {

            document.getElementById(
                "mensajeGuardado"
            ).textContent = "";

        },
        2000
    );

}


// =====================================================
// CERRAR FICHA
// =====================================================

function cerrarFicha() {

    document
        .getElementById(
            "panelMunicipio"
        )
        .classList.remove(
            "abierto"
        );


    document
        .getElementById(
            "overlay"
        )
        .classList.remove(
            "visible"
        );


    municipioActual = null;

}


// =====================================================
// NORMALIZAR TEXTO
// =====================================================

function normalizarTexto(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


// =====================================================
// BUSCADOR
// =====================================================

document
    .getElementById("buscador")
    .addEventListener(
        "input",
        buscarMunicipio
    );


function buscarMunicipio() {

    const texto =
        normalizarTexto(

            document
                .getElementById(
                    "buscador"
                )
                .value
                .trim()

        );


    if (!texto) {

        mostrarVisitados();

        return;

    }


    const encontrados =
        Object.values(
            datosMunicipios
        ).filter(
            municipio =>

                normalizarTexto(
                    municipio.nombre
                ).includes(texto)

        );


    actualizarLista(
        encontrados
    );


    if (
        encontrados.length === 1
    ) {

        const municipio =
            encontrados[0];


        mapa.fitBounds(

            municipio.capa.getBounds(),

            {
                padding:
                    [50, 50]
            }

        );


        abrirFicha(

            municipio.codigo,

            municipio.nombre

        );

    }

}


// =====================================================
// LISTA
// =====================================================

function actualizarLista(
    listaPersonalizada = null
) {

    const contenedor =
        document.getElementById(
            "listaMunicipios"
        );


    contenedor.innerHTML = "";


    let lista;


    if (
        listaPersonalizada !== null
    ) {

        lista =
            listaPersonalizada;

    } else {

        lista =
            Object.values(
                datosMunicipios
            )
            .filter(
                municipio =>

                    visitados.includes(
                        municipio.codigo
                    )

            )
            .sort(
                (a, b) =>

                    a.nombre.localeCompare(
                        b.nombre,
                        "es"
                    )

            );

    }


    if (
        lista.length === 0
    ) {

        contenedor.innerHTML = `

            <div style="
                color:#64748b;
                padding:10px;
            ">

                No hay municipios para mostrar.

            </div>

        `;

        return;

    }


    lista.forEach(
        municipio => {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "municipio-lista";


            const estaVisitado =
                visitados.includes(
                    municipio.codigo
                );


            elemento.textContent =
                estaVisitado
                    ? "✓ " + municipio.nombre
                    : municipio.nombre;


            elemento.onclick =
                function() {

                    mapa.fitBounds(

                        municipio.capa.getBounds(),

                        {
                            padding:
                                [50, 50]
                        }

                    );


                    abrirFicha(

                        municipio.codigo,

                        municipio.nombre

                    );

                };


            contenedor.appendChild(
                elemento
            );

        }
    );

}


// =====================================================
// MOSTRAR VISITADOS
// =====================================================

function mostrarVisitados() {

    document.getElementById(
        "tituloLista"
    ).textContent =
        "Mis municipios visitados";


    actualizarLista();

}


// =====================================================
// MOSTRAR TODOS
// =====================================================

function mostrarTodos() {

    document.getElementById(
        "tituloLista"
    ).textContent =
        "Municipios";


    document.getElementById(
        "buscador"
    ).value = "";


    const todos =
        Object.values(
            datosMunicipios
        )
        .sort(
            (a, b) =>
                a.nombre.localeCompare(
                    b.nombre,
                    "es"
                )
        );


    actualizarLista(
        todos
    );

}


// =====================================================
// REINICIAR
// =====================================================

function reiniciarProgreso() {

    const confirmar =
        confirm(

            "Esto eliminará todos los municipios visitados y sus datos personales. ¿Continuar?"

        );


    if (!confirmar) {
        return;
    }


    visitados = [];


    informacionMunicipios = {};


    guardarVisitas();


    guardarInformacion();


    Object.values(
        capasMunicipios
    ).forEach(
        capa => {

            capa.setStyle(

                estiloMunicipio(
                    capa.feature
                )

            );

        }
    );


    actualizarEstadisticas();


    cerrarFicha();

}


// =====================================================
// CARGAR MAPA
// =====================================================

fetch(GEOJSON_URL)

    .then(
        respuesta => {

            if (!respuesta.ok) {

                throw new Error(
                    "No se pudo cargar el mapa."
                );

            }


            return respuesta.json();

        }
    )

    .then(
        datos => {

            const antioquia =
                datos.features.filter(

                    feature =>

                        String(
                            feature
                                .properties
                                .divipola_dep
                        ) === "05"

                );


            capaAntioquia =

                L.geoJSON(

                    antioquia,

                    {

                        style:
                            estiloMunicipio,


                        onEachFeature:

                            function(
                                feature,
                                layer
                            ) {

                                const codigo =

                                    String(

                                        feature
                                            .properties
                                            .divipola_mun

                                    );


                                const nombre =

                                    feature
                                        .properties
                                        .mpio_nombre;


                                capasMunicipios[
                                    codigo
                                ] = layer;


                                datosMunicipios[
                                    codigo
                                ] = {

                                    codigo:
                                        codigo,

                                    nombre:
                                        nombre,

                                    capa:
                                        layer

                                };


                                layer.bindTooltip(

                                    nombre,

                                    {

                                        sticky:
                                            true,

                                        direction:
                                            "top"

                                    }

                                );


                                layer.on({

                                    mouseover:
                                        function(e) {

                                            e.target
                                                .setStyle({

                                                    weight:
                                                        2,

                                                    color:
                                                        "#111",

                                                    fillOpacity:
                                                        0.95

                                                });

                                        },


                                    mouseout:
                                        function(e) {

                                            e.target
                                                .setStyle(

                                                    estiloMunicipio(
                                                        feature
                                                    )

                                                );

                                        },


                                    click:
                                        function() {

                                            abrirFicha(

                                                codigo,

                                                nombre

                                            );

                                        }

                                });

                            }

                    }

                )

                .addTo(mapa);


            mapa.fitBounds(
                capaAntioquia.getBounds()
            );


            actualizarSeleccionColor();

            actualizarEstadisticas();

            mostrarVisitados();

        }
    )

    .catch(

        error => {

            console.error(error);


            document.getElementById(
                "mapa"
            ).innerHTML = `

                <div style="
                    padding:40px;
                    text-align:center;
                    color:#b91c1c;
                ">

                    <h3>
                        Error cargando el mapa
                    </h3>

                    <p>
                        No se pudo cargar la
                        información geográfica.
                    </p>

                </div>

            `;

        }

    );


</script>
