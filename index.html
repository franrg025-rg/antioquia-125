<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antioquia - 125 Municipios</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .contenedor {
      padding: 15px;
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .tarjeta {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tarjeta-titulo {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .tarjeta-valor {
      font-size: 25px;
      font-weight: bold;
    }

    .barra-contenedor {
      background: #e5e7eb;
      border-radius: 999px;
      height: 13px;
      overflow: hidden;
      margin-top: 10px;
    }

    .barra {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.3s ease;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-principal {
      background: #2563eb;
      color: white;
    }

    .btn-secundario {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-peligro {
      background: #dc2626;
      color: white;
    }

    .buscador {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .contenido {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 12px;
    }

    #mapa {
      height: 650px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .lista {
      background: white;
      border-radius: 12px;
      padding: 12px;
      height: 650px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .lista h3 {
      margin-top: 5px;
      margin-bottom: 10px;
    }

    .municipio-lista {
      padding: 9px;
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      border-radius: 7px;
    }

    .municipio-lista:hover {
      background: #f3f4f6;
    }

    .municipio-lista.visitado {
      background: #f0fdf4;
    }

    .punto-color {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .leyenda {
      background: white;
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      line-height: 22px;
    }

    .leyenda-color {
      width: 16px;
      height: 16px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 3px;
    }

    /* PANEL LATERAL */

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 999;
    }

    .panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 420px;
      max-width: 95%;
      height: 100vh;
      background: white;
      z-index: 1000;
      box-shadow: -4px 0 15px rgba(0,0,0,0.2);
      padding: 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }

    .panel.abierto {
      transform: translateX(0);
    }

    .panel-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .panel-cabecera h2 {
      margin: 0;
      font-size: 24px;
    }

    .cerrar {
      background: #e5e7eb;
      font-size: 18px;
      padding: 7px 11px;
    }

    .estado {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .estado-visitado {
      background: #dcfce7;
      color: #166534;
    }

    .estado-no-visitado {
      background: #f3f4f6;
      color: #4b5563;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }

    .campo textarea {
      min-height: 100px;
      resize: vertical;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    /* SELECTOR DE COLOR INDIVIDUAL */

    .selector-color-ficha {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 8px;
    }

    .color-opcion-ficha {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 1px #d1d5db;
      padding: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .color-opcion-ficha:hover {
      transform: scale(1.1);
    }

    .color-opcion-ficha.seleccionado {
      box-shadow: 0 0 0 3px #111827;
      transform: scale(1.08);
    }

    .mensaje-color {
      font-size: 12px;
      color: #6b7280;
      margin-top: 7px;
    }

    @media (max-width: 900px) {
      .contenido {
        grid-template-columns: 1fr;
      }

      .lista {
        height: auto;
        max-height: 400px;
      }

      #mapa {
        height: 550px;
      }
    }

    @media (max-width: 600px) {
      .estadisticas {
        grid-template-columns: 1fr;
      }

      .panel {
        width: 100%;
        max-width: 100%;
      }

      #mapa {
        height: 500px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Antioquia - 125 Municipios</h1>
  <p>Mapa personal de municipios visitados</p>
</header>

<div class="contenedor">

  <div class="estadisticas">

    <div class="tarjeta">
      <div class="tarjeta-titulo">Municipios visitados</div>
      <div class="tarjeta-valor">
        <span id="contadorVisitados">0</span> / 125
      </div>
    </div>

    <div class="tarjeta">
      <div class="tarjeta-titulo">Porcentaje completado</div>
      <div class="tarjeta-valor">
        <span id="porcentaje">0</span>%
      </div>

      <div class="barra-contenedor">
        <div class="barra" id="barraProgreso"></div>
      </div>
    </div>

    <div class="tarjeta">
      <div class="tarjeta-titulo">Pendientes</div>
      <div class="tarjeta-valor" id="contadorPendientes">125</div>
    </div>

  </div>

  <div class="controles">
    <button class="btn-principal" onclick="mostrarVisitados()">
      Mis municipios
    </button>

    <button class="btn-secundario" onclick="mostrarTodos()">
      Mostrar todos
    </button>

    <button class="btn-peligro" onclick="reiniciarProgreso()">
      Reiniciar
    </button>
  </div>

  <input
    type="text"
    id="buscador"
    class="buscador"
    placeholder="Buscar municipio..."
    oninput="buscarMunicipio()"
  >

  <div class="contenido">

    <div id="mapa"></div>

    <div class="lista">
      <h3>Municipios</h3>
      <div id="listaMunicipios"></div>
    </div>

  </div>

</div>

<!-- PANEL -->

<div id="overlay" class="overlay" onclick="cerrarFicha()"></div>

<div id="panel" class="panel">

  <div class="panel-cabecera">

    <h2 id="nombreMunicipio">
      Municipio
    </h2>

    <button class="cerrar" onclick="cerrarFicha()">
      ×
    </button>

  </div>

  <div id="estadoFicha" class="estado estado-no-visitado">
    No visitado
  </div>

  <div class="campo">

    <label>
      Color de este municipio
    </label>

    <div class="selector-color-ficha">

      <button
        class="color-opcion-ficha"
        style="background:#22c55e"
        data-color="#22c55e"
        onclick="seleccionarColorMunicipio('#22c55e')"
        title="Verde"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#3b82f6"
        data-color="#3b82f6"
        onclick="seleccionarColorMunicipio('#3b82f6')"
        title="Azul"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#8b5cf6"
        data-color="#8b5cf6"
        onclick="seleccionarColorMunicipio('#8b5cf6')"
        title="Morado"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#f97316"
        data-color="#f97316"
        onclick="seleccionarColorMunicipio('#f97316')"
        title="Naranja"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#ef4444"
        data-color="#ef4444"
        onclick="seleccionarColorMunicipio('#ef4444')"
        title="Rojo"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#14b8a6"
        data-color="#14b8a6"
        onclick="seleccionarColorMunicipio('#14b8a6')"
        title="Turquesa"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#eab308"
        data-color="#eab308"
        onclick="seleccionarColorMunicipio('#eab308')"
        title="Amarillo"
      ></button>

      <button
        class="color-opcion-ficha"
        style="background:#ec4899"
        data-color="#ec4899"
        onclick="seleccionarColorMunicipio('#ec4899')"
        title="Rosado"
      ></button>

    </div>

    <div class="mensaje-color">
      Este color se aplica únicamente a este municipio.
    </div>

  </div>

  <div class="campo">

    <label for="fechaVisita">
      Fecha de visita
    </label>

    <input
      type="date"
      id="fechaVisita"
    >

  </div>

  <div class="campo">

    <label for="lugaresVisitados">
      Lugares que viste o visitaste
    </label>

    <textarea
      id="lugaresVisitados"
      placeholder="Ej: Parque principal, iglesia, embalse, restaurante..."
    ></textarea>

  </div>

  <div class="campo">

    <label for="notasMunicipio">
      Mis notas
    </label>

    <textarea
      id="notasMunicipio"
      placeholder="Escribe aquí cualquier cosa que quieras recordar..."
    ></textarea>

  </div>

  <div class="acciones">

    <button
      class="btn-principal"
      onclick="guardarFicha()"
    >
      Guardar información
    </button>

    <button
      class="btn-secundario"
      onclick="marcarDesdeFicha()"
    >
      Marcar visitado
    </button>

    <button
      class="btn-secundario"
      onclick="desmarcarDesdeFicha()"
    >
      Marcar no visitado
    </button>

    <button
      class="btn-peligro"
      onclick="eliminarDatosFicha()"
    >
      Eliminar información
    </button>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /* ==========================================
     CONFIGURACIÓN
  ========================================== */

  const TOTAL_MUNICIPIOS = 125;

  const STORAGE_VISITADOS =
    "municipiosVisitadosAntioquia";

  const STORAGE_INFORMACION =
    "informacionMunicipiosAntioquia";

  const COLOR_DEFAULT =
    "#22c55e";


  /* ==========================================
     VARIABLES
  ========================================== */

  let visitados =
    JSON.parse(
      localStorage.getItem(STORAGE_VISITADOS) || "[]"
    );

  let informacionMunicipios =
    JSON.parse(
      localStorage.getItem(STORAGE_INFORMACION) || "{}"
    );

  let municipiosGeoJSON = [];

  let capasMunicipios = [];

  let municipioActual = null;

  let mostrarSoloVisitados = false;


  /* ==========================================
     MAPA
  ========================================== */

  const mapa = L.map("mapa").setView(
    [7.0, -75.5],
    8
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(mapa);


  /* ==========================================
     ESTILO DE MUNICIPIO
  ========================================== */

  function estiloMunicipio(feature) {

    const codigo =
      String(feature.properties.divipola_mun);

    const visitado =
      visitados.includes(codigo);

    const info =
      informacionMunicipios[codigo] || {};

    let color =
      info.color || COLOR_DEFAULT;

    return {

      fillColor:
        visitado
          ? color
          : "#d1d5db",

      color:
        "#ffffff",

      weight:
        1,

      fillOpacity:
        visitado
          ? 0.72
          : 0.55

    };

  }


  /* ==========================================
     HOVER
  ========================================== */

  function eventosMunicipio(feature, layer) {

    layer.on({

      mouseover: function(e) {

        e.target.setStyle({

          weight: 3,

          color: "#111827",

          fillOpacity: 0.85

        });

        e.target.bringToFront();

      },

      mouseout: function(e) {

        const codigo =
          String(feature.properties.divipola_mun);

        const visitado =
          visitados.includes(codigo);

        const info =
          informacionMunicipios[codigo] || {};

        e.target.setStyle({

          fillColor:
            visitado
              ? (info.color || COLOR_DEFAULT)
              : "#d1d5db",

          color:
            "#ffffff",

          weight:
            1,

          fillOpacity:
            visitado
              ? 0.72
              : 0.55

        });

      },

      click: function() {

        abrirFicha(feature);

      }

    });

    layer.bindTooltip(
      feature.properties.mpio_nombre,
      {
        sticky: true
      }
    );

  }


  /* ==========================================
     GUARDAR VISITADOS
  ========================================== */

  function guardarVisitas() {

    localStorage.setItem(
      STORAGE_VISITADOS,
      JSON.stringify(visitados)
    );

  }


  /* ==========================================
     GUARDAR INFORMACIÓN
  ========================================== */

  function guardarInformacion() {

    localStorage.setItem(
      STORAGE_INFORMACION,
      JSON.stringify(informacionMunicipios)
    );

  }


  /* ==========================================
     ACTUALIZAR MAPA
  ========================================== */

  function actualizarMapa() {

    capasMunicipios.forEach(
      function(capa) {

        const codigo =
          String(
            capa.feature.properties.divipola_mun
          );

        const visitado =
          visitados.includes(codigo);

        const info =
          informacionMunicipios[codigo] || {};

        const color =
          info.color || COLOR_DEFAULT;

        capa.setStyle({

          fillColor:
            visitado
              ? color
              : "#d1d5db",

          color:
            "#ffffff",

          weight:
            1,

          fillOpacity:
            visitado
              ? 0.72
              : 0.55

        });

      }
    );

  }


  /* ==========================================
     ESTADÍSTICAS
  ========================================== */

  function actualizarEstadisticas() {

    const cantidad =
      visitados.length;

    const porcentaje =
      Math.round(
        (cantidad / TOTAL_MUNICIPIOS) * 100
      );

    const pendientes =
      TOTAL_MUNICIPIOS - cantidad;

    document.getElementById(
      "contadorVisitados"
    ).textContent = cantidad;

    document.getElementById(
      "porcentaje"
    ).textContent = porcentaje;

    document.getElementById(
      "contadorPendientes"
    ).textContent = pendientes;

    document.getElementById(
      "barraProgreso"
    ).style.width =
      porcentaje + "%";

  }


  /* ==========================================
     MARCAR VISITADO
  ========================================== */

  function marcarMunicipio(codigo) {

    codigo =
      String(codigo);

    if (!visitados.includes(codigo)) {

      visitados.push(codigo);

    }

    if (!informacionMunicipios[codigo]) {

      informacionMunicipios[codigo] = {};

    }

    if (
      !informacionMunicipios[codigo].color
    ) {

      informacionMunicipios[codigo].color =
        COLOR_DEFAULT;

    }

    guardarVisitas();

    guardarInformacion();

    actualizarMapa();

    actualizarEstadisticas();

    actualizarLista();

  }


  /* ==========================================
     DESMARCAR VISITADO
  ========================================== */

  function desmarcarMunicipio(codigo) {

    codigo =
      String(codigo);

    visitados =
      visitados.filter(
        function(item) {

          return item !== codigo;

        }
      );

    guardarVisitas();

    actualizarMapa();

    actualizarEstadisticas();

    actualizarLista();

  }


  /* ==========================================
     MARCAR DESDE FICHA
  ========================================== */

  function marcarDesdeFicha() {

    if (!municipioActual) {
      return;
    }

    const codigo =
      String(
        municipioActual.properties.divipola_mun
      );

    marcarMunicipio(codigo);

    actualizarEstadoFicha();

  }


  /* ==========================================
     DESMARCAR DESDE FICHA
  ========================================== */

  function desmarcarDesdeFicha() {

    if (!municipioActual) {
      return;
    }

    const codigo =
      String(
        municipioActual.properties.divipola_mun
      );

    desmarcarMunicipio(codigo);

    actualizarEstadoFicha();

  }


  /* ==========================================
     ABRIR FICHA
  ========================================== */

  function abrirFicha(feature) {

    municipioActual =
      feature;

    const codigo =
      String(
        feature.properties.divipola_mun
      );

    const nombre =
      feature.properties.mpio_nombre;

    document.getElementById(
      "nombreMunicipio"
    ).textContent =
      nombre;

    const info =
      informacionMunicipios[codigo] || {};

    document.getElementById(
      "fechaVisita"
    ).value =
      info.fecha || "";

    document.getElementById(
      "lugaresVisitados"
    ).value =
      info.lugares || "";

    document.getElementById(
      "notasMunicipio"
    ).value =
      info.notas || "";

    actualizarEstadoFicha();

    actualizarSeleccionColorFicha(
      info.color || COLOR_DEFAULT
    );

    document.getElementById(
      "overlay"
    ).style.display =
      "block";

    setTimeout(
      function() {

        document.getElementById(
          "panel"
        ).classList.add("abierto");

      },
      10
    );

  }


  /* ==========================================
     ACTUALIZAR ESTADO DE FICHA
  ========================================== */

  function actualizarEstadoFicha() {

    if (!municipioActual) {
      return;
    }

    const codigo =
      String(
        municipioActual.properties.divipola_mun
      );

    const estado =
      document.getElementById(
        "estadoFicha"
      );

    if (visitados.includes(codigo)) {

      estado.textContent =
        "✓ Municipio visitado";

      estado.className =
        "estado estado-visitado";

    } else {

      estado.textContent =
        "No visitado";

      estado.className =
        "estado estado-no-visitado";

    }

  }


  /* ==========================================
     SELECCIONAR COLOR INDIVIDUAL
  ========================================== */

  function seleccionarColorMunicipio(color) {

    if (!municipioActual) {
      return;
    }

    const codigo =
      String(
        municipioActual.properties.divipola_mun
      );

    if (!informacionMunicipios[codigo]) {

      informacionMunicipios[codigo] = {};

    }

    informacionMunicipios[codigo].color =
      color;

    /*
      Si escoges un color,
      automáticamente se marca como visitado.
    */

    if (!visitados.includes(codigo)) {

      visitados.push(codigo);

      guardarVisitas();

    }

    guardarInformacion();

    actualizarSeleccionColorFicha(color);

    actualizarMapa();

    actualizarEstadisticas();

    actualizarLista();

    actualizarEstadoFicha();

  }


  /* ==========================================
     ACTUALIZAR COLOR SELECCIONADO
  ========================================== */

  function actualizarSeleccionColorFicha(color) {

    const botones =
      document.querySelectorAll(
        ".color-opcion-ficha"
      );

    botones.forEach(
      function(boton) {

        const colorBoton =
          boton.getAttribute(
            "data-color"
          );

        if (colorBoton === color) {

          boton.classList.add(
            "seleccionado"
          );

        } else {

          boton.classList.remove(
            "seleccionado"
          );

        }

      }
    );

  }


  /* ==========================================
     GUARDAR FICHA
  ========================================== */

  function guardarFicha() {

    if (!municipioActual) {
      return;
    }

    const codigo =
      String(
        municipioActual.properties.divipola_mun
      );

    const nombre =
      municipioActual.properties.mpio_nombre;

    if (!informacionMunicipios[codigo]) {

      informacionMunicipios[codigo] = {};

    }

    informacionMunicipios[codigo].nombre =
      nombre;

    informacionMunicipios[codigo].fecha =
      document.getElementById(
        "fechaVisita"
      ).value;

    informacionMunicipios[codigo].lugares =
      document.getElementById(
        "lugaresVisitados"
      ).value;

    informacionMunicipios[codigo].notas =
      document.getElementById(
        "notasMunicipio"
      ).value;

    if (
      !informacionMunicipios[codigo].color
    ) {

      informacionMunicipios[codigo].color =
        COLOR_DEFAULT;

    }

    /*
      Si guardamos información,
      automáticamente se considera visitado.
    */

    if (!visitados.includes(codigo)) {

      visitados.push(codigo);

    }

    guardarVisitas();

    guardarInformacion();

    actualizarMapa();

    actualizarEstadisticas();

    actualizarLista();

    actualizarEstadoFicha();

    actualizarSeleccionColorFicha(
      informacionMunicipios[codigo].color
    );

    alert(
      "Información guardada correctamente."
    );

  }


  /* ==========================================
     ELIMINAR INFORMACIÓN
  ========================================== */

  function eliminarDatosFicha() {

    if (!municipioActual) {
      return;
    }

    const codigo =
      String(
        municipioActual.properties.divipola_mun
      );

    const confirmar =
      confirm(
        "¿Quieres eliminar toda la información guardada de este municipio?"
      );

    if (!confirmar) {
      return;
    }

    delete informacionMunicipios[codigo];

    guardarInformacion();

    actualizarMapa();

    actualizarLista();

    document.getElementById(
      "fechaVisita"
    ).value = "";

    document.getElementById(
      "lugaresVisitados"
    ).value = "";

    document.getElementById(
      "notasMunicipio"
    ).value = "";

    actualizarSeleccionColorFicha(
      COLOR_DEFAULT
    );

  }


  /* ==========================================
     CERRAR FICHA
  ========================================== */

  function cerrarFicha() {

    document.getElementById(
      "panel"
    ).classList.remove("abierto");

    setTimeout(
      function() {

        document.getElementById(
          "overlay"
        ).style.display =
          "none";

      },
      250
    );

    municipioActual =
      null;

  }


  /* ==========================================
     NORMALIZAR TEXTO
  ========================================== */

  function normalizarTexto(texto) {

    return texto
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase();

  }


  /* ==========================================
     BUSCADOR
  ========================================== */

  function buscarMunicipio() {

    const texto =
      normalizarTexto(
        document.getElementById(
          "buscador"
        ).value.trim()
      );

    capasMunicipios.forEach(
      function(capa) {

        const nombre =
          normalizarTexto(
            capa.feature.properties.mpio_nombre
          );

        const codigo =
          String(
            capa.feature.properties.divipola_mun
          );

        const visitado =
          visitados.includes(codigo);

        let visible =
          nombre.includes(texto);

        if (mostrarSoloVisitados) {

          visible =
            visible && visitado;

        }

        if (visible) {

          capa.setStyle({
            opacity: 1,
            fillOpacity:
              visitado ? 0.72 : 0.55
          });

        } else {

          capa.setStyle({
            opacity: 0.15,
            fillOpacity: 0.05
          });

        }

      }
    );

  }


  /* ==========================================
     LISTA DE MUNICIPIOS
  ========================================== */

  function actualizarLista() {

    const contenedor =
      document.getElementById(
        "listaMunicipios"
      );

    contenedor.innerHTML = "";

    const municipiosOrdenados =
      [...municipiosGeoJSON].sort(
        function(a, b) {

          return a.properties.mpio_nombre
            .localeCompare(
              b.properties.mpio_nombre,
              "es"
            );

        }
      );

    municipiosOrdenados.forEach(
      function(feature) {

        const codigo =
          String(
            feature.properties.divipola_mun
          );

        const nombre =
          feature.properties.mpio_nombre;

        const visitado =
          visitados.includes(codigo);

        if (
          mostrarSoloVisitados &&
          !visitado
        ) {

          return;

        }

        const info =
          informacionMunicipios[codigo] || {};

        const color =
          info.color || COLOR_DEFAULT;

        const elemento =
          document.createElement("div");

        elemento.className =
          "municipio-lista" +
          (
            visitado
              ? " visitado"
              : ""
          );

        elemento.innerHTML =

          '<span class="punto-color" ' +
          'style="background:' +
          color +
          '"></span>' +

          nombre +

          (
            visitado
              ? " ✓"
              : ""
          );

        elemento.onclick =
          function() {

            abrirFicha(feature);

            const capa =
              capasMunicipios.find(
                function(c) {

                  return String(
                    c.feature.properties.divipola_mun
                  ) === codigo;

                }
              );

            if (capa) {

              mapa.fitBounds(
                capa.getBounds(),
                {
                  padding: [30, 30]
                }
              );

            }

          };

        contenedor.appendChild(
          elemento
        );

      }
    );

  }


  /* ==========================================
     MOSTRAR VISITADOS
  ========================================== */

  function mostrarVisitados() {

    mostrarSoloVisitados =
      true;

    actualizarLista();

    buscarMunicipio();

  }


  /* ==========================================
     MOSTRAR TODOS
  ========================================== */

  function mostrarTodos() {

    mostrarSoloVisitados =
      false;

    actualizarLista();

    document.getElementById(
      "buscador"
    ).value = "";

    capasMunicipios.forEach(
      function(capa) {

        const codigo =
          String(
            capa.feature.properties.divipola_mun
          );

        const visitado =
          visitados.includes(codigo);

        const info =
          informacionMunicipios[codigo] || {};

        capa.setStyle({

          opacity: 1,

          fillOpacity:
            visitado
              ? 0.72
              : 0.55,

          fillColor:
            visitado
              ? (
                  info.color ||
                  COLOR_DEFAULT
                )
              : "#d1d5db"

        });

      }
    );

  }


  /* ==========================================
     REINICIAR
  ========================================== */

  function reiniciarProgreso() {

    const confirmar =
      confirm(
        "¿Seguro que quieres borrar todos los municipios visitados y toda la información guardada?"
      );

    if (!confirmar) {
      return;
    }

    visitados = [];

    informacionMunicipios = {};

    guardarVisitas();

    guardarInformacion();

    actualizarMapa();

    actualizarEstadisticas();

    actualizarLista();

    mostrarTodos();

  }


  /* ==========================================
     CARGAR GEOJSON
  ========================================== */

  fetch(
    "https://raw.githubusercontent.com/ytolosa/mapas-colombia/main/output/geojson/col_municipios_real_nacional.geojson"
  )

  .then(
    function(respuesta) {

      return respuesta.json();

    }
  )

  .then(
    function(data) {

      municipiosGeoJSON =
        data.features.filter(
          function(feature) {

            return String(
              feature.properties.divipola_dep
            ) === "05";

          }
        );

      /*
        Crear mapa
      */

      const geojson =
        L.geoJSON(
          {
            type: "FeatureCollection",
            features:
              municipiosGeoJSON
          },
          {
            style:
              estiloMunicipio,

            onEachFeature:
              eventosMunicipio
          }
        ).addTo(mapa);

      /*
        Guardar referencias
        de las capas
      */

      capasMunicipios =
        geojson.getLayers();

      /*
        Centrar mapa
      */

      mapa.fitBounds(
        geojson.getBounds()
      );

      actualizarEstadisticas();

      actualizarLista();

    }
  )

  .catch(
    function(error) {

      console.error(
        "Error cargando el mapa:",
        error
      );

      alert(
        "No se pudo cargar el mapa de Antioquia."
      );

    }
  );


  /* ==========================================
     LEYENDA
  ========================================== */

  const leyenda =
    L.control({
      position: "bottomright"
    });

  leyenda.onAdd =
    function() {

      const div =
        L.DomUtil.create(
          "div",
          "leyenda"
        );

      div.innerHTML =

        '<div>' +
          '<span class="leyenda-color" ' +
          'style="background:#d1d5db"></span>' +
          'No visitado' +
        '</div>' +

        '<div>' +
          '<span class="leyenda-color" ' +
          'style="background:#22c55e"></span>' +
          'Visitado' +
        '</div>' +

        '<div style="font-size:11px;color:#6b7280;margin-top:4px">' +
          'Cada municipio puede tener su propio color' +
        '</div>';

      return div;

    };

  leyenda.addTo(mapa);


</script>

</body>
</html>
