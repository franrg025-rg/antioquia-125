<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Antioquia</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .contador {
            font-size: 20px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .progreso {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
        }

        .barra {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.3s;
        }

        .mensaje {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>MI ANTIOQUIA</h1>
    <div class="contador">
        <span id="visitados">0</span> / 125 municipios visitados
    </div>
</header>

<main>

    <div class="tarjeta">

        <h2>Progreso</h2>

        <div class="progreso">
            <div class="barra" id="barra"></div>
        </div>

        <div id="porcentaje">
            0%
        </div>

        <div class="mensaje">
            Próximamente podrás marcar cada municipio que hayas visitado.
        </div>

    </div>

</main>

</body>
</html>
